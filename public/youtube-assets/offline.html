<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0f0f" />
    <title>Đang ngoại tuyến · DuongTube</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f0f0f; color: #f1f1f1; font: 16px/1.6 Arial, Helvetica, sans-serif; padding: 28px; }
      main { max-width: 440px; text-align: center; }
      img { width: 88px; height: 88px; border-radius: 22px; }
      h1 { margin: 24px 0 10px; font-size: 28px; line-height: 1.25; }
      p { margin: 0 0 28px; color: #aaa; }
      a { display: inline-block; padding: 10px 22px; border-radius: 24px; background: #f1f1f1; color: #0f0f0f; font-weight: 700; text-decoration: none; }
      a:hover { background: #ddd; }
      a:focus-visible { outline: 3px solid #3ea6ff; outline-offset: 5px; }
      small { display: block; margin-top: 30px; color: #717171; }
    </style>
  </head>
  <body>
    <main>
      <img src="/youtube-assets/icon-192.png" width="88" height="88" alt="DuongTube" />
      <h1>Bạn đang ngoại tuyến</h1>
      <p>Kết nối Wi-Fi hoặc dữ liệu di động để tiếp tục khám phá và nghe nhạc. DuongTube cần mạng để phát nội dung.</p>
      <a href="">Thử kết nối lại</a>
      <small>DuongTube</small>
    </main>
  </body>
</html>
